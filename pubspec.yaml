name: just_inputs
description: "Input actions for Flutter games: keyboard, mouse, gamepads and touch, with local multiplayer, player rebinding and on-screen controls."
version: 0.1.0
homepage: https://engine.justunknown.com/
repository: https://github.com/just-unknown-dev/just-inputs
issue_tracker: https://github.com/just-unknown-dev/just-inputs/issues
topics:
  - input
  - gamepad
  - keyboard
  - gamedev
  - game

environment:
  # Dart 3.12 for private named initializing formals (InputActions,
  # RebindingOperation). Flutter 3.44 is the first stable release with it.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  just_gamepads: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Pointer lock on Windows (`PointerLock`). Everywhere else the Dart side
  # answers "not supported" without calling a channel, so no other platform
  # needs a plugin class.
  plugin:
    platforms:
      windows:
        pluginClass: JustInputsPluginCApi
